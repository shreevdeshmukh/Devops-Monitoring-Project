global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - "APP1_PUBLIC_IP:9100"
          - "APP2_PUBLIC_IP:9100"
          - "LB_PUBLIC_IP:9100"

  - job_name: cadvisor
    static_configs:
      - targets:
          - "APP1_PUBLIC_IP:8081"
          - "APP2_PUBLIC_IP:8081"
